  <text x="240" y="296" font-family="serif" font-size="11" fill="#1B2A41" text-anchor="middle" opacity="0.5" letter-spacing="4">E-Commerce</text>
  <line x1="140" y1="284" x2="340" y2="284" stroke="#C9A45E" stroke-width="0.5" opacity="0.4"/>
