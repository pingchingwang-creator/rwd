  <rect x="255" y="215" width="60" height="22" rx="11" fill="#EE4D2D" opacity="0.85"/>
  <text x="285" y="229" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">Label</text>

  <!-- LINE badge -->
  <rect x="330" y="215" width="60" height="22" rx="11" fill="#00B900" opacity="0.85"/>
  <text x="360" y="229" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">Label</text>

