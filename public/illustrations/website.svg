<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="480" height="320" fill="#EDE7DC"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C9A45E" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="480" height="320" fill="url(#grid)"/>

  <!-- Browser window frame -->
  <rect x="80" y="50" width="320" height="210" rx="8" fill="#1B2A41" opacity="0.92"/>
  <rect x="80" y="50" width="320" height="32" rx="8" fill="#2D3F59"/>
  <rect x="80" y="70" width="320" height="12" fill="#2D3F59"/>

  <!-- Browser dots -->
  <circle cx="100" cy="66" r="5" fill="#B85C38" opacity="0.8"/>
  <circle cx="116" cy="66" r="5" fill="#C9A45E" opacity="0.8"/>
  <circle cx="132" cy="66" r="5" fill="#4F8A5E" opacity="0.8"/>

  <!-- URL bar -->
  <rect x="148" y="58" width="160" height="16" rx="8" fill="#1B2A41" opacity="0.6"/>
  <text x="228" y="69" font-family="monospace" font-size="7" fill="#C9A45E" text-anchor="middle" opacity="0.7">nandao-tech.tw</text>

  <!-- Page content inside browser -->
  <!-- Hero area -->
  <rect x="88" y="90" width="304" height="70" fill="#1B2A41" opacity="0.4"/>
