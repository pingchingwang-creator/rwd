  <line x1="88" y1="125" x2="392" y2="125" stroke="#C9A45E" stroke-width="0.5" opacity="0.3"/>
  <!-- Headline lines -->
  <rect x="140" y="108" width="120" height="8" rx="4" fill="#C9A45E" opacity="0.7"/>
  <rect x="160" y="122" width="80" height="5" rx="2.5" fill="#F5F0E8" opacity="0.4"/>
  <rect x="175" y="133" width="50" height="5" rx="2.5" fill="#C9A45E" opacity="0.5"/>
  <!-- CTA button -->
  <rect x="195" y="142" width="50" height="12" rx="6" fill="#C9A45E" opacity="0.8"/>
  <rect x="260" y="142" width="36" height="12" rx="6" fill="none" stroke="#F5F0E8" stroke-width="1" opacity="0.4"/>

  <!-- Nav items -->
  <rect x="200" y="97" width="24" height="4" rx="2" fill="#F5F0E8" opacity="0.5"/>
  <rect x="232" y="97" width="24" height="4" rx="2" fill="#F5F0E8" opacity="0.5"/>
  <rect x="264" y="97" width="24" height="4" rx="2" fill="#F5F0E8" opacity="0.5"/>
  <rect x="340" y="94" width="40" height="10" rx="5" fill="#C9A45E" opacity="0.7"/>

  <!-- Cards section -->
  <rect x="96" y="168" width="88" height="56" rx="4" fill="#F5F0E8" opacity="0.12"/>
  <rect x="104" y="176" width="40" height="5" rx="2" fill="#C9A45E" opacity="0.6"/>
  <rect x="104" y="185" width="72" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="104" y="191" width="60" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="104" y="197" width="50" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>

  <rect x="196" y="168" width="88" height="56" rx="4" fill="#F5F0E8" opacity="0.12"/>
  <rect x="204" y="176" width="40" height="5" rx="2" fill="#C9A45E" opacity="0.6"/>
  <rect x="204" y="185" width="72" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="204" y="191" width="60" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="204" y="197" width="50" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>

  <rect x="296" y="168" width="88" height="56" rx="4" fill="#F5F0E8" opacity="0.12"/>
  <rect x="304" y="176" width="40" height="5" rx="2" fill="#C9A45E" opacity="0.6"/>
  <rect x="304" y="185" width="72" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="304" y="191" width="60" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>
  <rect x="304" y="197" width="50" height="3" rx="1.5" fill="#F5F0E8" opacity="0.3"/>

